<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Visão Geral — Vibração</title>
<style>
  :root{
    --bg:#12151a; --panel:#1b1f26; --panel2:#20252d; --line:#2a2f38;
    --text:#e4e7eb; --dim:#8891a0; --accent:#3fa9f5;
    --ok:#3fbf6f; --alerta:#e8a83f; --alarme:#e5504f; --stale:#5a6070;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
  header{padding:16px 16px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
  header h1{font-size:16px;margin:0 0 2px;letter-spacing:.3px;}
  header p{margin:0;font-size:12px;color:var(--dim);}
  header a{font-size:12px;color:var(--accent);text-decoration:none;}
  main{padding:12px;max-width:900px;margin:0 auto;}
  .resumo{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .resumo .pill{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;}
  .resumo .pill .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
  .resumo .pill .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
  .resumo .pill.ok .n{color:var(--ok);}
  .resumo .pill.alerta .n{color:var(--alerta);}
  .resumo .pill.alarme .n{color:var(--alarme);}
  .resumo .pill.stale .n{color:var(--stale);}
  .grupo{margin-bottom:22px;}
  .grupo h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;padding-left:2px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:10px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
    border-left:4px solid var(--stale);
  }
  .card-clique{text-decoration:none;color:var(--text);display:block;transition:transform .1s ease;}
  .card-clique:active{transform:scale(0.98);}
  .card.ok{border-left-color:var(--ok);}
  .card.alerta{border-left-color:var(--alerta);}
  .card.alarme{border-left-color:var(--alarme);}
  .card.stale{border-left-color:var(--stale);opacity:.7;}
  .card.nao-cadastrado{border-left-color:var(--accent);border-style:dashed;opacity:1;}
  .card .ponto{font-size:14px;font-weight:600;margin-bottom:8px;}
  .card .eixos{display:flex;gap:10px;margin-bottom:8px;}
  .card .eixo{flex:1;text-align:center;background:var(--panel2);border-radius:6px;padding:6px 2px;}
  .card .eixo .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .card .eixo .k{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;}
  .novo-badge{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;}
  .novo-badge span{font-size:10.5px;color:var(--accent);font-weight:600;}
  .btn-add-catalogo{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .btn-add-catalogo:active{opacity:.8;}
  .btn-rename{background:var(--ok);color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .btn-rename:active{opacity:.8;}
  .rename-input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;margin-bottom:10px;}
  .rename-label{font-size:11px;color:var(--dim);display:block;margin-bottom:3px;}
  .card .rodape{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);}
  .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px;}
  .tag.ok{background:rgba(63,191,111,.15);color:var(--ok);}
  .tag.alerta{background:rgba(232,168,63,.15);color:var(--alerta);}
  .tag.alarme{background:rgba(229,80,79,.15);color:var(--alarme);}
  .tag.stale{background:rgba(90,96,112,.25);color:var(--dim);}
  .loading{text-align:center;color:var(--dim);font-size:13px;padding:40px 0;}
</style>
</head>
<body>
<header>
  <div>
    <h1>Visão Geral — Sensores de Vibração</h1>
    <p id="subtitulo">Carregando…</p>
  </div>
  <a href="historico.html">← Ver histórico detalhado</a>
</header>

<main>
  <div class="resumo" id="resumo" style="display:none;">
    <div class="pill ok"><div class="n" id="countOk">0</div><div class="l">OK</div></div>
    <div class="pill alerta"><div class="n" id="countAlerta">0</div><div class="l">Alerta</div></div>
    <div class="pill alarme"><div class="n" id="countAlarme">0</div><div class="l">Alarme</div></div>
    <div class="pill stale"><div class="n" id="countStale">0</div><div class="l">Sem dados recentes</div></div>
  </div>

  <div class="row" style="display:flex;gap:8px;margin-bottom:16px;">
    <button id="btnRelatorio7d" class="small" style="flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;cursor:pointer;font-weight:600;">📄 Relatório 7 dias</button>
    <button id="btnRelatorioMensal" class="small" style="flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;cursor:pointer;font-weight:600;">📄 Relatório mensal</button>
  </div>
  <div id="statusRelatorio" style="font-size:11px;color:var(--dim);text-align:center;margin:-10px 0 16px;min-height:14px;"></div>

  <div id="conteudo"><div class="loading">Carregando leituras…</div></div>

  <div id="renameOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:20px;">
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:340px;width:100%;">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px;">Atribuir nome definitivo</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:14px;">O sensor físico (MAC <span id="renameMacId" style="color:var(--text);"></span>) vai adotar este nome em até 30 min, sem precisar regravar a firmware.</div>
      <label class="rename-label">Moinho</label>
      <input id="renameMoinho" class="rename-input" list="listaMoinhos" placeholder="ex: 502BM140">
      <label class="rename-label">Ponto de medição</label>
      <input id="renamePonto" class="rename-input" list="listaPontos" placeholder="ex: Mancal Motor LOA">
      <div id="renameErro" style="display:none;font-size:11px;color:var(--alarme);margin:-4px 0 10px;"></div>
      <datalist id="listaMoinhos"></datalist>
      <datalist id="listaPontos"></datalist>
      <div style="display:flex;gap:8px;">
        <button id="renameCancel" style="flex:1;padding:9px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;cursor:pointer;">Cancelar</button>
        <button id="renameSalvar" style="flex:1;padding:9px;border-radius:6px;border:none;background:var(--ok);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Salvar</button>
      </div>
    </div>
  </div>
</main>

<script>
const ALERTA = 4.5, ALARME = 7.1;

// Mesmo catalogo padrao do index.html - se o catalogo remoto (config/catalogo)
// tiver listas diferentes, elas substituem estas abaixo.
const MOINHOS_DEFAULT = ['501BM140','502BM140'];
const PONTOS_DEFAULT = ['Mancal Motor LOA','Mancal Motor LA','Redutor entrada LOA','Redutor entrada LA','Rolamento pinhão LOA','Rolamento pinhão LA'];

// Intervalo de envio do firmware (3h) - usado para decidir quando uma
// leitura esta "obsoleta" (sensor pode estar offline/sem energia/sem Wi-Fi).
// Tolerancia de 2.5x o intervalo antes de marcar como stale, para nao
// disparar falso alarme por atraso pontual de rede.
const SEND_INTERVAL_MS = 3 * 60 * 60 * 1000;
const STALE_THRESHOLD_MS = SEND_INTERVAL_MS * 2.5;

function tagStatus(valor){
  if(valor === null || valor === undefined) return null;
  if(valor >= ALARME) return 'alarme';
  if(valor >= ALERTA) return 'alerta';
  return 'ok';
}

function piorStatus(a, b){
  const ordem = {alarme:3, alerta:2, ok:1};
  if(!a) return b; if(!b) return a;
  return ordem[a] >= ordem[b] ? a : b;
}

function formatarRelativo(ts){
  if(!ts) return 'nunca';
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs/60000);
  if(min < 1) return 'agora mesmo';
  if(min < 60) return `há ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24) return `há ${h}h`;
  const d = Math.floor(h/24);
  return `há ${d}d`;
}

async function carregarCatalogo(){
  if(!db) return { moinhos: MOINHOS_DEFAULT, pontos: PONTOS_DEFAULT };
  try{
    const doc = await db.collection('config').doc('catalogo').get();
    if(doc.exists){
      const data = doc.data();
      return {
        moinhos: (Array.isArray(data.moinhos) && data.moinhos.length) ? data.moinhos : MOINHOS_DEFAULT,
        pontos: (Array.isArray(data.pontos) && data.pontos.length) ? data.pontos : PONTOS_DEFAULT,
      };
    }
  }catch(e){ console.error('Erro ao buscar catálogo:', e); }
  return { moinhos: MOINHOS_DEFAULT, pontos: PONTOS_DEFAULT };
}

async function carregarUltimasLeituras(){
  // Busca um lote recente e reduz no cliente para "ultima leitura por
  // moinho+ponto+eixo". Com 12 pontos x 3 eixos = 36 series e envio a
  // cada 3h, um lote de 300 documentos cobre bastante margem de historico.
  const mapa = {}; // chave "moinho|ponto|eixo" -> {valor, ts}
  if(!db) return mapa;
  try{
    const snap = await db.collection('leituras').orderBy('ts','desc').limit(300).get();
    snap.forEach(doc=>{
      const d = doc.data();
      const chave = `${d.moinho}|${d.ponto}|${d.eixo}`;
      if(!mapa[chave]){ // primeira ocorrencia = mais recente (ja ordenado desc)
        mapa[chave] = { valor: d.valor, ts: d.ts, macId: d.macId || null };
      }
    });
  }catch(e){
    console.error('Erro ao buscar leituras:', e);
  }
  return mapa;
}

function renderCard(moinho, ponto, leituras, cadastrado){
  const chaveH = `${moinho}|${ponto}|Horizontal`;
  const chaveV = `${moinho}|${ponto}|Vertical`;
  const chaveA = `${moinho}|${ponto}|Axial`;

  const H = leituras[chaveH], V = leituras[chaveV], A = leituras[chaveA];
  const tsMaisRecente = Math.max(H?.ts||0, V?.ts||0, A?.ts||0) || null;
  const macId = H?.macId || V?.macId || A?.macId || null;

  const stH = tagStatus(H?.valor), stV = tagStatus(V?.valor), stA = tagStatus(A?.valor);
  let status = piorStatus(piorStatus(stH, stV), stA) || 'stale';

  const semDadosAinda = !H && !V && !A;
  const obsoleto = tsMaisRecente && (Date.now() - tsMaisRecente > STALE_THRESHOLD_MS);
  if(semDadosAinda || obsoleto) status = 'stale';

  const fmtV = (v)=> v!==undefined && v!==null ? v.toFixed(2) : '—';
  const params = new URLSearchParams({ moinho, ponto });

  const labelTag = { ok:'OK', alerta:'Alerta', alarme:'Alarme', stale: (semDadosAinda ? 'Sem dados' : 'Desatualizado') };

  const moinhoEsc = moinho.replace(/'/g,"\\'");
  const pontoEsc = ponto.replace(/'/g,"\\'");
  const avisoNaoCadastrado = cadastrado ? '' : (macId
    ? `
      <div class="novo-badge">
        <span>🆕 Detectado, não cadastrado</span>
        <button class="btn-rename" onclick="event.preventDefault(); event.stopPropagation(); promptRenomear('${macId}','${moinhoEsc}','${pontoEsc}');">✏️ Atribuir nome definitivo</button>
      </div>`
    : `
      <div class="novo-badge">
        <span>🆕 Detectado, não cadastrado</span>
        <button class="btn-add-catalogo" onclick="event.preventDefault(); event.stopPropagation(); adicionarAoCatalogo('${moinhoEsc}','${pontoEsc}');">+ Adicionar ao catálogo</button>
      </div>`);

  return `
    <div class="card ${status} ${cadastrado ? '' : 'nao-cadastrado'}">
      <a class="card-clique" href="historico.html?${params.toString()}">
        <div class="ponto">${ponto}</div>
        <div class="eixos">
          <div class="eixo"><div class="v">${fmtV(H?.valor)}</div><div class="k">H</div></div>
          <div class="eixo"><div class="v">${fmtV(V?.valor)}</div><div class="k">V</div></div>
          <div class="eixo"><div class="v">${fmtV(A?.valor)}</div><div class="k">A</div></div>
        </div>
        <div class="rodape">
          <span>${formatarRelativo(tsMaisRecente)}</span>
          <span class="tag ${status}">${labelTag[status]}</span>
        </div>
      </a>${avisoNaoCadastrado}
    </div>`;
}

async function adicionarAoCatalogo(moinho, ponto){
  if(!db) return;
  try{
    await db.collection('config').doc('catalogo').set({
      moinhos: firebase.firestore.FieldValue.arrayUnion(moinho),
      pontos: firebase.firestore.FieldValue.arrayUnion(ponto),
    }, { merge: true });
    document.getElementById('subtitulo').textContent = `"${ponto}" (${moinho}) adicionado ao catálogo.`;
    montarPainel();
  }catch(e){
    console.error('Erro ao adicionar ao catálogo:', e);
    document.getElementById('subtitulo').textContent = 'Erro ao adicionar ao catálogo — veja o console.';
  }
}

// ---- Nomeação remota (via Firestore, sem precisar abrir o portal físico) ----
// Grava o nome definitivo em sensores/<macId>; o firmware do sensor consulta
// esse documento (no boot e depois a cada 30 min) e adota o nome sozinho.
function promptRenomear(macId, moinhoAtual, pontoAtual){
  const overlay = document.getElementById('renameOverlay');
  document.getElementById('renameMacId').textContent = macId;
  document.getElementById('renameErro').style.display = 'none';
  // Nao preenche com os placeholders automaticos ("A CONFIGURAR"/"Sensor-XXXX") -
  // so com um nome ja definitivo, se por algum motivo ja houver um.
  document.getElementById('renameMoinho').value = (moinhoAtual && moinhoAtual !== 'A CONFIGURAR') ? moinhoAtual : '';
  document.getElementById('renamePonto').value = (pontoAtual && !pontoAtual.startsWith('Sensor-')) ? pontoAtual : '';
  overlay.dataset.macId = macId;
  overlay.style.display = 'flex';
}

async function atribuirNomeRemoto(macId, moinho, ponto){
  if(!db) return;
  await db.collection('sensores').doc(macId).set({ moinho, ponto }, { merge: true });
  await adicionarAoCatalogo(moinho, ponto); // ja atualiza o catalogo e reabre o painel
  document.getElementById('subtitulo').textContent = `Nome "${ponto}" (${moinho}) atribuído ao sensor ${macId}. Ele adota o novo nome em até 30 min (ou no próximo religamento).`;
}

document.getElementById('renameCancel').addEventListener('click', ()=>{
  document.getElementById('renameOverlay').style.display = 'none';
});

document.getElementById('renameSalvar').addEventListener('click', async ()=>{
  const overlay = document.getElementById('renameOverlay');
  const macId = overlay.dataset.macId;
  const moinho = document.getElementById('renameMoinho').value.trim();
  const ponto = document.getElementById('renamePonto').value.trim();
  const erroEl = document.getElementById('renameErro');
  if(!moinho || !ponto){
    erroEl.textContent = 'Preencha moinho e ponto de medição.';
    erroEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('renameSalvar');
  btn.disabled = true;
  try{
    await atribuirNomeRemoto(macId, moinho, ponto);
    overlay.style.display = 'none';
  }catch(e){
    console.error('Erro ao atribuir nome remoto:', e);
    erroEl.textContent = 'Erro ao salvar — veja o console.';
    erroEl.style.display = 'block';
  }finally{
    btn.disabled = false;
  }
});

function atualizarListasSugestao(moinhos, pontos){
  const dlM = document.getElementById('listaMoinhos');
  const dlP = document.getElementById('listaPontos');
  if(dlM) dlM.innerHTML = moinhos.map(m=>`<option value="${m.replace(/"/g,'&quot;')}">`).join('');
  if(dlP) dlP.innerHTML = pontos.map(p=>`<option value="${p.replace(/"/g,'&quot;')}">`).join('');
}

async function montarPainel(){
  const [{ moinhos, pontos }, leituras] = await Promise.all([carregarCatalogo(), carregarUltimasLeituras()]);
  atualizarListasSugestao(moinhos, pontos);

  // Pares (moinho|ponto) ja cadastrados no catalogo (produto cartesiano)
  const paresCatalogo = new Set();
  moinhos.forEach(m => pontos.forEach(p => paresCatalogo.add(`${m}|${p}`)));

  // Pares que realmente tem leituras chegando, mesmo que ainda nao cadastrados
  const paresComDados = new Set();
  Object.keys(leituras).forEach(chave=>{
    const partes = chave.split('|'); // "moinho|ponto|eixo"
    if(partes.length >= 2) paresComDados.add(`${partes[0]}|${partes[1]}`);
  });

  // Estrutura final: moinho -> Map(ponto -> cadastrado?)
  const estrutura = {};
  const registrarPar = (par, cadastrado)=>{
    const [m, p] = par.split('|');
    if(!estrutura[m]) estrutura[m] = new Map();
    const jaCadastrado = estrutura[m].get(p);
    estrutura[m].set(p, jaCadastrado || cadastrado);
  };
  paresCatalogo.forEach(par => registrarPar(par, true));
  paresComDados.forEach(par => registrarPar(par, false)); // so marca true se ja nao estiver

  // Ordem de exibicao: moinhos do catalogo primeiro, depois moinhos novos (so em dados)
  const moinhosExibir = [...moinhos, ...Object.keys(estrutura).filter(m=>!moinhos.includes(m))];

  let countOk=0, countAlerta=0, countAlarme=0, countStale=0, countNaoCadastrados=0;
  let html = '';
  let totalPontosExibidos = 0;

  moinhosExibir.forEach(moinho=>{
    const mapaPontos = estrutura[moinho];
    if(!mapaPontos || mapaPontos.size === 0) return;
    // Pontos do catalogo primeiro (na ordem cadastrada), depois os novos (so em dados)
    const pontosOrdenados = [...pontos.filter(p=>mapaPontos.has(p)), ...[...mapaPontos.keys()].filter(p=>!pontos.includes(p))];

    html += `<div class="grupo"><h2>${moinho}</h2><div class="grid">`;
    pontosOrdenados.forEach(ponto=>{
      const cadastrado = mapaPontos.get(ponto);
      const cardHtml = renderCard(moinho, ponto, leituras, cadastrado);
      html += cardHtml;
      totalPontosExibidos++;
      if(!cadastrado) countNaoCadastrados++;
      if(cardHtml.includes('card ok')) countOk++;
      else if(cardHtml.includes('card alerta')) countAlerta++;
      else if(cardHtml.includes('card alarme')) countAlarme++;
      else countStale++;
    });
    html += `</div></div>`;
  });

  document.getElementById('conteudo').innerHTML = html || '<div class="loading">Nenhum ponto cadastrado nem detectado ainda.</div>';
  document.getElementById('countOk').textContent = countOk;
  document.getElementById('countAlerta').textContent = countAlerta;
  document.getElementById('countAlarme').textContent = countAlarme;
  document.getElementById('countStale').textContent = countStale;
  document.getElementById('resumo').style.display = 'flex';
  document.getElementById('subtitulo').textContent = countNaoCadastrados > 0
    ? `${totalPontosExibidos} pontos (${countNaoCadastrados} não cadastrados) · atualizado ${formatarRelativo(Date.now())}`
    : `${totalPontosExibidos} pontos monitorados · atualizado ${formatarRelativo(Date.now())}`;
}

montarPainel();
// Atualiza sozinho a cada 2 minutos, sem precisar recarregar a pagina
setInterval(montarPainel, 2 * 60 * 1000);

// ---------------- Relatorio PDF (7 dias / mensal) ----------------

async function buscarLeiturasPeriodo(diasAtras){
  const cutoff = Date.now() - diasAtras * 24 * 60 * 60 * 1000;
  const leituras = [];
  if(!db) return leituras;
  const snap = await db.collection('leituras')
    .where('ts', '>=', cutoff)
    .orderBy('ts', 'asc')
    .get();
  snap.forEach(doc => leituras.push(doc.data()));
  return leituras;
}

function calcularEstatisticas(leituras, moinhos, pontos){
  // chave "moinho|ponto|eixo" -> {valores:[], count, min, max, soma, statusAtual}
  const grupos = {};
  leituras.forEach(l=>{
    const chave = `${l.moinho}|${l.ponto}|${l.eixo}`;
    if(!grupos[chave]) grupos[chave] = { valores: [] };
    grupos[chave].valores.push({ valor: l.valor, ts: l.ts });
  });

  const linhas = [];
  moinhos.forEach(moinho=>{
    pontos.forEach(ponto=>{
      ['Horizontal','Vertical','Axial'].forEach(eixo=>{
        const chave = `${moinho}|${ponto}|${eixo}`;
        const g = grupos[chave];
        if(!g || g.valores.length === 0){
          linhas.push({ moinho, ponto, eixo, n:0, media:null, max:null, statusMax:'stale', qtdAlerta:0, qtdAlarme:0 });
          return;
        }
        const vs = g.valores.map(v=>v.valor);
        const media = vs.reduce((a,b)=>a+b,0) / vs.length;
        const max = Math.max(...vs);
        const qtdAlerta = vs.filter(v=>v>=ALERTA && v<ALARME).length;
        const qtdAlarme = vs.filter(v=>v>=ALARME).length;
        const statusMax = max>=ALARME ? 'alarme' : max>=ALERTA ? 'alerta' : 'ok';
        linhas.push({ moinho, ponto, eixo, n: vs.length, media, max, statusMax, qtdAlerta, qtdAlarme });
      });
    });
  });
  return linhas;
}

// ---------------- Gráficos de histórico do período (para o PDF) ----------------
// Mesma lógica de desenho usada em historico.html (canvas 2D puro, sem libs
// externas), só que num canvas fora da tela para virar PNG e entrar no PDF
// via doc.addImage().
function desenharGraficoCanvas(dadosPonto, w, h){
  const cores = { Horizontal: '#2f7fb8', Vertical: '#2f9e5c', Axial: '#9c5fb0' };
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // fundo branco - o PDF é sobre papel, canvas por padrão é transparente
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  const padL = 46, padR = 14, padT = 20, padB = 30;
  const maxV = Math.max(ALARME * 1.3, ...dadosPonto.map(d => d.valor), 1);
  const tsList = dadosPonto.map(d => d.ts);
  const minTs = Math.min(...tsList), maxTs = Math.max(...tsList);
  const spanTs = (maxTs - minTs) || 1;

  const X = (ts) => padL + (w - padL - padR) * (ts - minTs) / spanTs;
  const Y = (v) => padT + (h - padT - padB) * (1 - v / maxV);

  // grid + eixo Y
  ctx.strokeStyle = '#d8dde3'; ctx.fillStyle = '#333'; ctx.font = '11px sans-serif';
  [0, maxV / 2, maxV].forEach(v => {
    const y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(v.toFixed(1), 4, y + 4);
  });

  // rótulos de data (início, meio, fim)
  const fmt = (ts) => new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  ctx.fillStyle = '#555';
  ctx.textAlign = 'left';   ctx.fillText(fmt(minTs), X(minTs), h - 8);
  ctx.textAlign = 'center'; ctx.fillText(fmt(minTs + spanTs / 2), X(minTs + spanTs / 2), h - 8);
  ctx.textAlign = 'right';  ctx.fillText(fmt(maxTs), X(maxTs), h - 8);
  ctx.textAlign = 'left';

  // linhas de limiar ISO
  const limiar = (v, cor) => {
    const y = Y(v);
    ctx.strokeStyle = cor; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.setLineDash([]);
  };
  limiar(ALERTA, '#c98a2e'); limiar(ALARME, '#c14544');

  // séries por eixo
  for (const eixo of ['Horizontal', 'Vertical', 'Axial']) {
    const pts = dadosPonto.filter(d => d.eixo === eixo);
    if (pts.length === 0) continue;
    ctx.strokeStyle = cores[eixo]; ctx.fillStyle = cores[eixo]; ctx.lineWidth = 2.2;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = X(p.ts), y = Y(p.valor);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    pts.forEach(p => {
      const x = X(p.ts), y = Y(p.valor);
      ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
    });
  }

  // legenda
  ctx.font = '10px sans-serif';
  const legendas = [
    ['Horizontal', cores.Horizontal], ['Vertical', cores.Vertical], ['Axial', cores.Axial],
    ['Alerta 4,5', '#c98a2e'], ['Alarme 7,1', '#c14544'],
  ];
  let lx = padL;
  legendas.forEach(([label, cor]) => {
    ctx.fillStyle = cor; ctx.fillRect(lx, 3, 9, 9);
    ctx.fillStyle = '#333'; ctx.fillText(label, lx + 12, 11);
    lx += ctx.measureText(label).width + 30;
  });

  return canvas.toDataURL('image/png');
}

// Agrupa as leituras brutas do período por "moinho|ponto" (mantendo os 3
// eixos juntos, na ordem certa pro desenho do gráfico)
function agruparLeiturasPorPonto(leituras){
  const grupos = {};
  leituras.forEach(l => {
    const chave = `${l.moinho}|${l.ponto}`;
    if(!grupos[chave]) grupos[chave] = [];
    grupos[chave].push(l);
  });
  Object.values(grupos).forEach(arr => arr.sort((a, b) => a.ts - b.ts));
  return grupos;
}

// Adiciona uma seção nova ao PDF com um gráfico de histórico (H/V/A x tempo)
// por ponto de medição que teve leitura no período. Pontos sem dados no
// período são pulados aqui (a tabela já deixa claro que ficaram "Sem dados").
function desenharGraficosNoPDF(doc, leituras, moinhos, pontos){
  const grupos = agruparLeiturasPorPonto(leituras);
  const IMG_W = 900, IMG_H = 230;               // resolução do canvas offscreen (px)
  const PDF_IMG_W = 260;                         // largura no PDF (mm)
  const PDF_IMG_H = Math.round(PDF_IMG_W * IMG_H / IMG_W * 10) / 10; // mantém proporção
  const margemX = 17, limiteY = 195;             // A4 paisagem ~210mm de altura

  doc.addPage();
  let y = 20;
  doc.setFontSize(13); doc.setTextColor(0);
  doc.text('Anexo — Histórico do período por ponto de medição', margemX, y);
  y += 9;

  let algumGrafico = false;
  moinhos.forEach(moinho => {
    pontos.forEach(ponto => {
      const chave = `${moinho}|${ponto}`;
      const dadosPonto = grupos[chave];
      if(!dadosPonto || dadosPonto.length === 0) return; // sem leituras no período

      algumGrafico = true;
      if(y + 6 + PDF_IMG_H > limiteY){
        doc.addPage();
        y = 20;
      }

      doc.setFontSize(10.5); doc.setTextColor(30);
      doc.text(`${moinho} · ${ponto}`, margemX, y);
      y += 4;

      const dataUrl = desenharGraficoCanvas(dadosPonto, IMG_W, IMG_H);
      doc.addImage(dataUrl, 'PNG', margemX, y, PDF_IMG_W, PDF_IMG_H);
      y += PDF_IMG_H + 8;
    });
  });

  if(!algumGrafico){
    doc.setFontSize(10); doc.setTextColor(120);
    doc.text('Nenhum ponto teve leituras registradas neste período para exibir gráfico.', margemX, y);
  }
}

function gerarPDF(linhas, tituloPeriodo, diasAtras, leituras, moinhos, pontos){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

  const agora = new Date();
  doc.setFontSize(16);
  doc.text('Relatório de Vibração — Redutores 501BM140 / 502BM140', 14, 16);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(`Período: ${tituloPeriodo} · Gerado em ${agora.toLocaleDateString('pt-BR')} ${agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`, 14, 23);
  doc.text('Limiares ISO 10816-3: Alerta ≥ 4,5 mm/s · Alarme ≥ 7,1 mm/s', 14, 28);

  const corLinha = (status) => {
    if(status === 'alarme') return [229, 80, 79];
    if(status === 'alerta') return [232, 168, 63];
    if(status === 'stale') return [140, 140, 140];
    return [255, 255, 255];
  };

  const linhasTabela = linhas.map(l => [
    l.moinho, l.ponto, l.eixo,
    l.n > 0 ? l.n : '—',
    l.media !== null ? l.media.toFixed(2) : '—',
    l.max !== null ? l.max.toFixed(2) : '—',
    l.n === 0 ? 'Sem dados' : (l.statusMax === 'alarme' ? 'ALARME' : l.statusMax === 'alerta' ? 'Alerta' : 'OK'),
    l.qtdAlerta || 0,
    l.qtdAlarme || 0,
  ]);

  doc.autoTable({
    startY: 33,
    head: [['Moinho', 'Ponto', 'Eixo', 'Leituras', 'Média (mm/s)', 'Máximo (mm/s)', 'Status', 'Nº Alertas', 'Nº Alarmes']],
    body: linhasTabela,
    styles: { fontSize: 8 },
    headStyles: { fillColor: [40, 44, 52] },
    didParseCell: (data)=>{
      if(data.section === 'body'){
        const linha = linhas[data.row.index];
        if(linha && (linha.statusMax === 'alarme' || linha.statusMax === 'alerta')){
          data.cell.styles.textColor = corLinha(linha.statusMax);
          data.cell.styles.fontStyle = 'bold';
        }
      }
    },
  });

  const totalAlarmes = linhas.reduce((s,l)=>s+(l.qtdAlarme||0),0);
  const totalAlertas = linhas.reduce((s,l)=>s+(l.qtdAlerta||0),0);
  const semDados = linhas.filter(l=>l.n===0).length;
  const finalY = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(9);
  doc.setTextColor(0);
  doc.text(`Resumo do período: ${totalAlarmes} leitura(s) em Alarme · ${totalAlertas} leitura(s) em Alerta · ${semDados} série(s) sem dados no período.`, 14, finalY);

  desenharGraficosNoPDF(doc, leituras, moinhos, pontos);

  doc.save(`relatorio_vibracao_${diasAtras}d_${agora.toISOString().slice(0,10)}.pdf`);
}

async function exportarRelatorio(diasAtras, tituloPeriodo, btnId){
  const btn = document.getElementById(btnId);
  const statusEl = document.getElementById('statusRelatorio');
  btn.disabled = true;
  statusEl.textContent = 'Gerando relatório, aguarde…';
  try{
    const { moinhos, pontos } = await carregarCatalogo();
    const leituras = await buscarLeiturasPeriodo(diasAtras);
    const linhas = calcularEstatisticas(leituras, moinhos, pontos);
    gerarPDF(linhas, tituloPeriodo, diasAtras, leituras, moinhos, pontos);
    statusEl.textContent = `Relatório gerado com ${leituras.length} leitura(s) no período e gráficos de histórico por ponto.`;
  }catch(e){
    console.error('Erro ao gerar relatório:', e);
    statusEl.textContent = 'Erro ao gerar relatório. Veja o console para detalhes.';
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('btnRelatorio7d').addEventListener('click', ()=>{
  exportarRelatorio(7, 'Últimos 7 dias', 'btnRelatorio7d');
});
document.getElementById('btnRelatorioMensal').addEventListener('click', ()=>{
  exportarRelatorio(30, 'Últimos 30 dias', 'btnRelatorioMensal');
});
