<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Misturador 600MX022</title>
<!--
  Misturador 600MX022 (silo 7). Dados: GET /api/misturador (misturador.js), a cada 2 s.
  Escritas (PIN das receitas + operador): materiais das cápsulas (só no servidor),
  receita da dosagem automática (grava MX22_PCT/MX22_CAP_PROD no CLP — vale a partir
  da próxima batelada) e "reconhecer alarmes" (MX22_RESET). Não comanda válvulas.
-->
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --card-b:#1f2c44; --txt:#e6edf6; --txt-dim:#8493ab;
    --ok:#22c55e; --off:#4b5568; --bad:#ef4444; --warn:#f59e0b; --accent:#3b82f6; --cinza:#a8b3c4;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-tap-highlight-color:transparent;}
  header{position:sticky; top:0; z-index:10; background:#0b1220ee; backdrop-filter:blur(6px); padding:12px 14px; border-bottom:1px solid var(--card-b);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  header h1{font-size:15px; margin:0; font-weight:600;}
  header h1 span{color:var(--txt-dim); font-weight:400; font-size:12px; display:block; margin-top:2px;}
  .btn-l{background:var(--card); color:var(--txt); border:1px solid var(--card-b); padding:6px 10px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap;}
  #conn{font-size:11px; padding:4px 9px; border-radius:20px; font-weight:600; display:flex; align-items:center; gap:5px;}
  #conn .dot{width:7px; height:7px; border-radius:50%;}
  .conn-ok{background:#0f2e1c; color:var(--ok);} .conn-ok .dot{background:var(--ok);}
  .conn-bad{background:#2e1414; color:var(--bad);} .conn-bad .dot{background:var(--bad); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  main{padding:12px 14px 50px; max-width:760px; margin:0 auto;}
  .sec{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--txt-dim); margin:18px 2px 8px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
  .card{background:var(--card); border:1px solid var(--card-b); border-radius:14px; padding:14px;}
  .pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .p-on{background:#0f2e1c; color:var(--ok);} .p-off{background:#1a2233; color:var(--txt-dim);}
  .p-bad{background:#2e1414; color:var(--bad);} .p-warn{background:#332405; color:var(--warn);}

  /* Balança */
  .peso-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .peso{font-size:52px; font-weight:800; line-height:1; letter-spacing:-1px; font-variant-numeric:tabular-nums;}
  .peso small{font-size:18px; color:var(--txt-dim); font-weight:600; margin-left:4px;}
  .bar{height:14px; background:#0b1220; border:1px solid var(--card-b); border-radius:8px; overflow:hidden; margin-top:12px; position:relative;}
  .bar .f{height:100%; background:linear-gradient(90deg,#2563eb,#3b82f6); transition:width .6s;}
  .bar .f.cheio{background:linear-gradient(90deg,#16a34a,#22c55e);} .bar .f.acima{background:linear-gradient(90deg,#d97706,#f59e0b);}
  .bar.fina{height:6px; margin-top:6px;}
  .bar-legenda{display:flex; justify-content:space-between; font-size:11px; color:var(--txt-dim); margin-top:5px;}

  /* Silo 7 */
  .silo{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media(max-width:520px){ .silo{grid-template-columns:repeat(2,1fr);} }
  .caps{background:var(--card); border:1px solid var(--card-b); border-radius:14px; padding:10px 10px 12px; text-align:center; position:relative; transition:border-color .3s;}
  .caps.aberta{border-color:var(--ok); box-shadow:0 0 0 1px #22c55e55 inset;}
  .caps.alerta{border-color:var(--warn);}
  .forma{width:62px; height:70px; margin:2px auto 8px; position:relative;}
  .forma .corpo{position:absolute; left:6px; right:6px; top:0; height:40px; background:#1c2840; border:2px solid #31415f; border-bottom:none; border-radius:6px 6px 0 0;}
  .forma .cone{position:absolute; left:6px; right:6px; top:40px; height:22px; background:#1c2840; border:2px solid #31415f; border-top:none;
    clip-path:polygon(0 0,100% 0,62% 100%,38% 100%);}
  .forma .fluxo{position:absolute; left:50%; top:60px; width:6px; height:10px; margin-left:-3px; border-radius:2px; background:transparent;}
  .caps.aberta .fluxo{background:var(--ok); animation:cair .7s linear infinite;}
  @keyframes cair{0%{opacity:.3; transform:translateY(-3px)}100%{opacity:1; transform:translateY(3px)}}
  .caps .num{font-size:13px; font-weight:800;}
  .caps .mat{font-size:12.5px; font-weight:700; margin-top:3px; min-height:16px; color:var(--cinza); overflow-wrap:anywhere;}
  .caps .mat.vazio{color:var(--txt-dim); font-weight:400; font-style:italic;}
  .caps .fg{font-size:10.5px; color:var(--txt-dim); margin:6px 0 6px;}
  .seta{text-align:center; color:var(--txt-dim); font-size:18px; margin:8px 0 2px;}

  /* Misturador / descarga */
  .linha{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-top:1px dashed var(--card-b); font-size:13.5px;}
  .linha:first-child{border-top:none; padding-top:0;}
  .vals{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .val{background:#0f1729; border:1px solid var(--card-b); border-radius:10px; padding:8px 10px;}
  .val .l{font-size:10.5px; color:var(--txt-dim); text-transform:uppercase; letter-spacing:.4px;}
  .val .v{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
  .ts{font-size:10.5px; color:var(--txt-dim); text-align:right; margin-top:10px;}
  .aviso{border-radius:10px; padding:10px 12px; font-size:12.5px; margin-top:10px; background:#332405; color:var(--warn); line-height:1.4;}

  /* Modal */
  .ov{display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50; align-items:flex-end; justify-content:center;}
  .ov.open{display:flex;}
  @media(min-width:640px){ .ov{align-items:center;} }
  .box{background:var(--card); border:1px solid var(--card-b); border-radius:16px; width:100%; max-width:460px; padding:14px;}
  .box h2{font-size:15px; margin:0 0 10px;}
  .fr{display:grid; grid-template-columns:60px 1fr; gap:8px; align-items:center; margin-bottom:8px; font-size:13px;}
  .inp{background:#0f1729; border:1px solid var(--card-b); color:var(--txt); padding:10px 12px; border-radius:10px; font-size:15px; outline:none; width:100%; text-transform:uppercase;}
  .inp:focus{border-color:var(--accent);}
  .row{display:flex; gap:8px; margin-top:10px;} .row .b{flex:1;}
  .b{background:var(--accent); color:#fff; border:none; padding:11px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;}
  .b.sec2{background:var(--card); color:var(--txt); border:1px solid var(--card-b);}
  #m-err{color:var(--bad); font-size:12px; min-height:16px; margin-top:6px;}
  .prog{height:10px; background:#0b1220; border:1px solid var(--card-b); border-radius:6px; overflow:hidden; margin-top:6px;}
  .prog .f{height:100%; background:linear-gradient(90deg,#16a34a,#22c55e); transition:width .6s;}
  .alm{border-radius:10px; padding:9px 12px; font-size:13px; margin-top:8px; background:#2e1414; color:#fca5a5; display:flex; justify-content:space-between; gap:8px; align-items:center;}
  .comp{display:flex; justify-content:space-between; padding:6px 0; border-top:1px dashed var(--card-b); font-size:13.5px;}
  .comp:first-child{border-top:none;}
  select.inp{text-transform:none; font-size:14px;}
  .tbl{width:100%; border-collapse:collapse; font-size:12.5px;}
  .tbl td,.tbl th{padding:6px 4px; border-bottom:1px dashed var(--card-b); text-align:right;}
  .tbl th{color:var(--txt-dim); font-weight:600; font-size:10.5px; text-transform:uppercase;}
  .tbl td:first-child,.tbl th:first-child{text-align:left;}
</style>
</head>
<body>
<header>
  <h1>Misturador 600MX022<span>Silo 7 · dosagem automática</span></h1>
  <a class="btn-l" href="mobile-status.html">← Status</a>
  <div id="conn" class="conn-bad"><span class="dot"></span>conectando…</div>
</header>

<main>
  <div class="sec"><span>Balança</span><span id="seletora"></span></div>
  <div class="card">
    <div class="peso-top">
      <div class="peso" id="peso">—<small>kg</small></div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--txt-dim)">Batelada</div>
        <div style="font-size:20px;font-weight:800" id="bat-meta">— kg</div>
        <div style="font-size:12px;color:var(--txt-dim)" id="bat-falta"></div>
      </div>
    </div>
    <div class="bar"><div class="f" id="bar-bat" style="width:0%"></div></div>
    <div class="bar-legenda"><span>0</span><span id="bar-bat-pct">0%</span><span id="bar-bat-max">1.000 kg</span></div>
    <div class="bar fina"><div class="f" id="bar-cap" style="width:0%"></div></div>
    <div class="bar-legenda"><span>Capacidade da balança</span><span id="bar-cap-max">6.000 kg</span></div>
  </div>

  <div class="sec"><span>Dosagem automática</span></div>
  <div class="card" id="dosagem"></div>
  <div id="alarmes"></div>

  <div class="sec"><span>Silo 7 — cápsulas</span><button class="btn-l" id="btn-mat">✏️ Materiais</button></div>
  <div class="silo" id="silo"></div>
  <div class="seta">▼ ▼ ▼ ▼</div>

  <div class="sec"><span>Misturador / descarga</span></div>
  <div class="card">
    <div class="linha"><span>600MX022</span><span id="mx-estado"></span></div>
    <div id="descargas"></div>
    <div class="vals">
      <div class="val"><div class="l">Velocidade</div><div class="v" id="mx-hz">—</div></div>
      <div class="val"><div class="l">Corrente</div><div class="v" id="mx-a">—</div></div>
    </div>
  </div>

  <div class="sec"><span>Receita da dosagem</span><button class="btn-l" id="btn-rec">🧪 Trocar receita</button></div>
  <div class="card" id="receita"></div>

  <div class="sec"><span>Hoje</span><a class="btn-l" href="#" id="btn-hist">📅 45 dias</a></div>
  <div class="card" id="hoje"></div>
  <div id="aviso"></div>
  <div class="ts" id="ts"></div>
</main>

<div class="ov" id="ov">
  <div class="box">
    <h2 id="m-tit"></h2>
    <div id="m-campos"></div>
    <input class="inp" type="text" id="m-user" placeholder="Operador" maxlength="60" style="text-transform:none;margin-bottom:8px">
    <input class="inp" type="password" id="m-pin" placeholder="PIN" inputmode="numeric" style="text-transform:none">
    <div id="m-err"></div>
    <div class="row"><button class="b sec2" id="m-cancel">Cancelar</button><button class="b" id="m-ok">Salvar</button></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var dados = null, timer = null, desde = {}, acaoModal = null;
  var USER_KEY = 'receitas_operador';
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function kg(v){ return Math.round(Number(v) || 0).toLocaleString('pt-BR'); }
  function num(v, c){ return v == null ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c }); }
  function pill(cls, t){ return '<span class="pill ' + cls + '">' + t + '</span>'; }
  function rotulo(chave){ var m = ((dados && dados.materiais) || []).find(function(x){ return x.chave === chave; }); return m ? m.rotulo : chave; }

  // Cápsulas: o relé de campo alterna 5 s fluidizando / 5 s aberta enquanto o CLP manda abrir
  function pillCapsula(v){
    if (!v || v.erro) return pill('p-bad', 'SEM LEITURA');
    if (v.comandoAbrir) return v.aberta ? pill('p-on', '● ABERTA') : pill('p-on', '◐ FLUIDIZANDO');
    if (v.aberta) return pill('p-warn', '◐ FECHANDO');
    return v.fechada ? pill('p-off', '○ FECHADA') : pill('p-warn', 'SEM POSIÇÃO');
  }
  function pillDescarga(v){
    if (!v || v.erro) return pill('p-bad', 'SEM LEITURA');
    if (v.aberta && v.comandoAbrir) return pill('p-on', '● ABERTA');
    if (v.fechada && !v.comandoAbrir) return pill('p-off', '○ FECHADA');
    return v.comandoAbrir ? pill('p-warn', '◐ ABRINDO') : pill('p-warn', '◐ FECHANDO');
  }

  async function ler(){
    clearTimeout(timer);
    try { var r = await fetch('/api/misturador', { cache: 'no-store' }); dados = await r.json(); render(); }
    catch(e) { $('conn').className = 'conn-bad'; $('conn').innerHTML = '<span class="dot"></span>sem servidor'; }
    timer = setTimeout(ler, 2000);
  }

  function render(){
    var e = dados && dados.estado, idade = dados && dados.idadeMs;
    var velho = !e || idade == null || idade > 15000;
    $('conn').className = velho ? 'conn-bad' : 'conn-ok';
    $('conn').innerHTML = '<span class="dot"></span>' + (!e ? 'aguardando CLP' : velho ? 'dados parados' : 'CLP');

    // Balança
    var bat = dados.batelada || 1000, cap = dados.balancaMax || 6000, peso = e ? e.peso : null;
    $('bat-meta').textContent = kg(bat) + ' kg'; $('bar-bat-max').textContent = kg(bat) + ' kg'; $('bar-cap-max').textContent = kg(cap) + ' kg';
    $('peso').innerHTML = (peso == null ? '—' : kg(peso)) + '<small>kg</small>';
    var pct = peso == null ? 0 : Math.max(0, peso) / bat * 100;
    $('bar-bat').style.width = Math.min(100, pct) + '%';
    $('bar-bat').className = 'f' + (pct > 110 ? ' acima' : pct >= 90 ? ' cheio' : '');
    $('bar-bat-pct').textContent = Math.round(pct) + '%';
    $('bat-falta').textContent = peso == null ? '' : peso < bat ? 'faltam ' + kg(bat - peso) + ' kg' : 'batelada completa';
    $('bar-cap').style.width = (peso == null ? 0 : Math.min(100, Math.max(0, peso) / cap * 100)) + '%';

    var s = e && e.seletora;
    $('seletora').innerHTML = !s || !s.configurada ? pill('p-off', 'SELETORA SEM LEITURA')
      : s.habilitada ? pill('p-on', '● DOSAGEM HABILITADA') : pill('p-off', '○ DOSAGEM DESABILITADA');

    // Dosagem automática
    var d = e && e.dosagem, caps = dados.capsulas || [];
    if (!e) $('dosagem').innerHTML = '<div class="linha"><span style="color:var(--txt-dim)">Aguardando leitura do CLP…</span></div>';
    else if (!d) $('dosagem').innerHTML = '<div class="linha"><span style="color:var(--txt-dim)">Rotina de dosagem ainda não instalada no CLP (tags MX22_*).</span></div>';
    else {
      var prodMat = '', rc = (dados.receitasClp || {})[d.rcpSeqAtivo];
      if (rc && rc.produtos && d.produto) prodMat = rotulo(rc.produtos[d.produto] || '');
      var capAtual = d.capsula ? caps[d.capsula - 1] : null;
      var h = '<div class="linha"><span>Etapa</span><b>' + esc(d.passoTexto) + '</b></div>';
      if (d.passo === 25 || d.passo === 30) {
        var p = d.alvo > 0 ? Math.min(100, Math.max(0, d.dosado / d.alvo * 100)) : 0;
        h += '<div class="linha"><span>Produto</span><b>' + esc(prodMat || ('Produto ' + d.produto)) + (capAtual ? ' · cápsula ' + esc(capAtual.id) : '') + '</b></div>' +
          '<div style="font-size:13px;margin-top:4px">' + kg(d.dosado) + ' de ' + kg(d.alvo) + ' kg</div><div class="prog"><div class="f" style="width:' + p + '%"></div></div>';
      }
      h += '<div class="linha" style="margin-top:6px"><span>Bateladas concluídas (contador do CLP)</span><b>' + kg(d.batSeq) + '</b></div>';
      $('dosagem').innerHTML = h;
    }
    var alms = (d && d.alarmes) || [];
    $('alarmes').innerHTML = alms.length ? alms.map(function(a){
      var extra = a.bit === 1 && d.capsulasVazias.length ? ': ' + d.capsulasVazias.join(', ') : '';
      return '<div class="alm"><span>⚠ ' + esc(a.texto + extra) + '</span></div>';
    }).join('') + '<div class="row"><button class="b sec2" id="btn-reset">Reconhecer alarmes</button></div>' : '';
    if (alms.length) $('btn-reset').onclick = function(){ abrirModal('Reconhecer alarmes', '<div style="font-size:13px;margin-bottom:10px">Zera os alarmes no CLP. Em pausa por falta de cápsula, a dosagem retoma o produto.</div>', resetar); };

    // Cápsulas
    var est = (e && e.capsulas) || [];
    $('silo').innerHTML = caps.map(function(c, i){
      var v = est[i] || {};
      var vazia = d && d.capsulasVazias.indexOf(c.id) >= 0;
      var cls = v.comandoAbrir ? ' aberta' : vazia ? ' alerta' : '';
      return '<div class="caps' + cls + '"><div class="forma"><div class="corpo"></div><div class="cone"></div><div class="fluxo"></div></div>' +
        '<div class="num">Cápsula ' + esc(c.id) + '</div>' +
        '<div class="mat' + (c.material ? '' : ' vazio') + '">' + (c.material ? esc(c.rotulo) : 'sem material') + '</div>' +
        '<div class="fg">' + esc(c.fg) + '</div>' + (e ? pillCapsula(v) : pill('p-off', '—')) +
        (vazia ? '<div style="margin-top:5px">' + pill('p-warn', 'VAZIA') + '</div>' : '') + '</div>';
    }).join('');

    var m = e && e.misturador;
    $('mx-estado').innerHTML = !m ? pill('p-off', '—') : m.falha ? pill('p-bad', '⚠ FALHA / TRIP') : m.ligado ? pill('p-on', '● LIGADO') : pill('p-off', '○ DESLIGADO');
    $('mx-hz').innerHTML = m ? num(m.hz, 1) + ' <small style="font-size:12px;color:var(--txt-dim)">Hz</small>' : '—';
    $('mx-a').innerHTML = m ? num(m.a, 1) + ' <small style="font-size:12px;color:var(--txt-dim)">A</small>' : '—';
    $('descargas').innerHTML = ((e && e.descargas) || []).map(function(v){ return '<div class="linha"><span>Descarga ' + esc(v.fg) + '</span>' + pillDescarga(v) + '</div>'; }).join('');

    // Receita
    var rec = (dados.receitasMix || []).find(function(r){ return r.nome === dados.receitaAtual; });
    var rh = '';
    if (!dados.receitaAtual) rh = '<div class="linha"><span style="color:var(--txt-dim)">Nenhuma receita gravada no CLP por esta tela.</span></div>';
    else {
      rh = '<div class="linha"><span>Receita</span><b>' + esc(dados.receitaAtual) + '</b></div>';
      if (rec) Object.keys(rec.mps).forEach(function(mat){
        var cs = caps.filter(function(c){ return c.material === mat; }).map(function(c){ return c.id; });
        rh += '<div class="comp"><span>' + esc(rotulo(mat)) + ' <small style="color:var(--txt-dim)">' + (cs.length ? 'cápsulas ' + cs.join(' / ') : 'sem cápsula!') + '</small></span><b>' + num(rec.mps[mat] * 100, 1) + '%</b></div>';
      });
      if (d && d.rcpSeq !== d.rcpSeqAtivo) rh += '<div class="aviso" style="margin-top:8px">Receita nova gravada — entra no início da próxima batelada.</div>';
    }
    $('receita').innerHTML = rh;

    // Hoje
    var hj = dados.hoje;
    var hh = '<div class="vals" style="margin-top:0"><div class="val"><div class="l">Bateladas</div><div class="v">' + (hj ? kg(hj.bateladas) : '0') + '</div></div>' +
      '<div class="val"><div class="l">Pozomix MIX</div><div class="v">' + (hj ? num(hj.totalKg / 1000, 2) : '0') + ' <small style="font-size:12px;color:var(--txt-dim)">t</small></div></div></div>';
    if (hj) Object.keys(hj.kg).forEach(function(mat){ hh += '<div class="comp"><span>' + esc(rotulo(mat)) + '</span><b>' + num(hj.kg[mat] / 1000, 2) + ' t</b></div>'; });
    hh += '<div style="font-size:11px;color:var(--txt-dim);margin-top:8px">Vai automaticamente para o app Cimento Gaúcho (aba Saídas, Pozomix 7510 MIX) e baixa as cinzas do estoque pelo peso real.</div>';
    $('hoje').innerHTML = hh;

    // Válvula comandada fechada mas com fim de curso de aberta por mais de 15 s
    var agoraMs = Date.now();
    est.concat((e && e.descargas) || []).forEach(function(v){ var ruim = !v.comandoAbrir && v.aberta; if (ruim) { if (!desde[v.fg]) desde[v.fg] = agoraMs; } else delete desde[v.fg]; });
    var al = Object.keys(desde).filter(function(fg){ return agoraMs - desde[fg] > 15000; });
    $('aviso').innerHTML = al.length ? '<div class="aviso">Válvula aberta sem comando: ' + al.join(', ') + '. Confira o fim de curso ou o comando manual.</div>' : '';
    $('ts').textContent = e ? 'Leitura do CLP às ' + new Date(e.ts).toLocaleTimeString('pt-BR') : 'O servidor começa a ler o CLP quando esta tela é aberta — aguarde alguns segundos.';
  }

  // ── Modal com operador + PIN ──
  function abrirModal(tit, html, acao){
    $('m-tit').textContent = tit; $('m-campos').innerHTML = html; $('m-err').textContent = '';
    try { $('m-user').value = $('m-user').value || localStorage.getItem(USER_KEY) || ''; } catch(e){}
    acaoModal = acao; $('ov').classList.add('open');
  }
  $('m-cancel').addEventListener('click', function(){ $('ov').classList.remove('open'); });
  $('m-ok').addEventListener('click', async function(){
    if (!$('m-user').value.trim()){ $('m-err').textContent = 'Informe o operador.'; return; }
    $('m-ok').disabled = true; $('m-err').textContent = 'Enviando…';
    try { localStorage.setItem(USER_KEY, $('m-user').value.trim()); } catch(e){}
    try {
      var r = await acaoModal();
      var j = await r.json();
      if (r.ok){ $('ov').classList.remove('open'); $('m-pin').value = ''; ler(); if (j.mensagem) alert(j.mensagem); }
      else $('m-err').textContent = j.mensagem || ('Erro ' + r.status);
    } catch(e){ $('m-err').textContent = 'Sem conexão com o servidor.'; }
    $('m-ok').disabled = false;
  });
  function post(url, corpo){
    corpo.usuario = $('m-user').value.trim();
    return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-receitas-pin': $('m-pin').value }, body: JSON.stringify(corpo) });
  }
  function resetar(){ return post('/api/misturador/reset', {}); }

  $('btn-mat').addEventListener('click', function(){
    var mats = (dados && dados.materiais) || [];
    var h = (dados.capsulas || []).map(function(c){
      return '<div class="fr"><span>' + esc(c.id) + '</span><select class="inp" data-id="' + esc(c.id) + '"><option value="">— sem material —</option>' +
        mats.map(function(m){ return '<option value="' + esc(m.chave) + '"' + (m.chave === c.material ? ' selected' : '') + '>' + esc(m.rotulo) + '</option>'; }).join('') + '</select></div>';
    }).join('') + '<div style="font-size:12px;color:var(--txt-dim);margin-bottom:10px">Cápsulas com o mesmo material são usadas uma após a outra quando uma esvazia. Depois de mudar, aplique a receita de novo.</div>';
    abrirModal('Material de cada cápsula', h, function(){
      var cs = {}; document.querySelectorAll('#m-campos select').forEach(function(s){ cs[s.dataset.id] = s.value; });
      return post('/api/misturador/capsulas', { capsulas: cs });
    });
  });

  $('btn-rec').addEventListener('click', function(){
    var rs = (dados && dados.receitasMix) || [];
    if (!rs.length){ alert('Nenhuma receita de mistura no app. Cadastre no app Cimento Gaúcho (aba Receitas, marcando "misturador").'); return; }
    var h = '<select class="inp" id="m-rec" style="margin-bottom:8px">' + rs.map(function(r){
      return '<option value="' + esc(r.nome) + '"' + (r.nome === dados.receitaAtual ? ' selected' : '') + '>' + esc(r.nome) + '</option>'; }).join('') + '</select><div id="m-rec-det" style="margin-bottom:10px"></div>';
    abrirModal('Receita da dosagem automática', h, function(){ return post('/api/misturador/receita', { receita: $('m-rec').value }); });
    function det(){
      var r = rs.find(function(x){ return x.nome === $('m-rec').value; });
      $('m-rec-det').innerHTML = r ? Object.keys(r.mps).map(function(m){ return '<div class="comp"><span>' + esc(rotulo(m)) + '</span><b>' + num(r.mps[m] * 100, 1) + '% · ' + kg(r.mps[m] * (dados.batelada || 1000)) + ' kg</b></div>'; }).join('') +
        '<div style="font-size:12px;color:var(--txt-dim);margin-top:6px">Grava no CLP; entra no início da próxima batelada.</div>' : '';
    }
    $('m-rec').addEventListener('change', det); det();
  });

  $('btn-hist').addEventListener('click', async function(ev){
    ev.preventDefault();
    try {
      var j = await (await fetch('/api/misturador/historico', { cache: 'no-store' })).json();
      var h = '<table class="tbl"><tr><th>Dia</th><th>Bat.</th><th>t</th><th>Receita</th></tr>' + (j.dias || []).map(function(d){
        var p = d.data.split('-'); return '<tr><td>' + p[2] + '/' + p[1] + '</td><td>' + d.bateladas + '</td><td>' + num(d.totalKg / 1000, 2) + '</td><td>' + esc(d.receita || '—') + '</td></tr>';
      }).join('') + '</table>';
      $('m-tit').textContent = 'Últimos 45 dias'; $('m-campos').innerHTML = (j.dias || []).length ? h : '<div style="color:var(--txt-dim)">Sem bateladas registradas.</div>';
      $('ov').classList.add('open'); acaoModal = null;
      $('m-user').style.display = $('m-pin').style.display = $('m-ok').style.display = 'none';
      $('m-cancel').textContent = 'Fechar';
      $('m-cancel').onclick = function(){ $('m-user').style.display = $('m-pin').style.display = $('m-ok').style.display = ''; $('m-cancel').textContent = 'Cancelar'; };
    } catch(e){}
  });

  ler();
})();
</script>
</body>
</html>
